<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="/manifest.json">
<title>AURA AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#05070d;
  color:#f3f6ff;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif
}
header{
  padding:18px;
  border-bottom:1px solid #202638;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:5px
}
.badge{
  font-size:11px;
  padding:6px 9px;
  border:1px solid #27314b;
  border-radius:999px
}
main{
  width:min(1000px,94%);
  margin:20px auto
}
.card{
  background:#0a0e18;
  border:1px solid #20283a;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px
}
input,textarea,button,select{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid #29334a;
  background:#070a12;
  color:white;
  margin-top:8px
}
button{
  cursor:pointer;
  font-weight:700
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.chat{
  height:52vh;
  min-height:300px;
  overflow:auto;
  padding:10px
}
.msg{
  padding:12px 14px;
  border-radius:14px;
  margin:9px 0;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.user{background:#172038;margin-left:12%}
.ai{background:#101723;margin-right:12%}
.muted{
  color:#8994aa;
  font-size:13px
}
.hidden{display:none}
.toolbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}
@media(max-width:650px){
  .row,.toolbar{grid-template-columns:1fr}
  .user,.ai{margin-left:0;margin-right:0}
}
</style>
</head>

<body>

<header>
  <div>
    <div class="logo">AURA</div>
    <div class="muted">Your AI presence, when you're away.</div>
  </div>
  <div id="status" class="badge">OFFLINE</div>
</header>

<main>

<section id="auth" class="card">
  <h2>Welcome to AURA</h2>
  <input id="username" placeholder="Username" autocomplete="username">
  <input id="password" type="password" placeholder="Password"
         autocomplete="current-password">

  <div class="row">
    <button onclick="login()">LOGIN</button>
    <button onclick="register()">CREATE ACCOUNT</button>
  </div>

  <p id="authMsg" class="muted"></p>
</section>

<section id="app" class="hidden">

<div class="card">
  <div class="row">
    <div>
      <strong id="who">AURA USER</strong>
      <div class="muted" id="brain">Local brain</div>
    </div>
    <button onclick="logout()">LOGOUT</button>
  </div>
</div>

<div class="card">
  <div id="chat" class="chat"></div>

  <textarea id="message"
            rows="3"
            placeholder="Talk to AURA..."></textarea>

  <div class="toolbar">
    <button onclick="send()">SEND</button>
    <button onclick="voiceInput()">🎙️ VOICE</button>
    <button onclick="speakLast()">🔊 SPEAK</button>
    <button onclick="loadHistory()">↻ HISTORY</button>
  </div>
</div>

<div class="card">
  <h3>Local Tools</h3>

  <div class="row">
    <button onclick="toolTime()">TIME</button>
    <button onclick="toolSystem()">SYSTEM</button>
  </div>

  <input id="calc" placeholder="Calculator e.g. (25*4)+10">
  <button onclick="toolCalc()">CALCULATE</button>
  <p id="toolOut" class="muted"></p>
</div>

<div class="card">
  <h3>Memory</h3>
  <input id="memoryText"
         placeholder="Something AURA should remember">
  <button onclick="saveMemory()">SAVE MEMORY</button>
  <p id="memoryOut" class="muted"></p>
</div>

<div class="card">
  <h3>Personalization</h3>

  <input id="profileName" placeholder="Your display name">

  <select id="personality">
    <option value="helpful">Helpful</option>
    <option value="concise">Concise</option>
    <option value="friendly">Friendly</option>
    <option value="technical">Technical</option>
  </select>

  <select id="language">
    <option value="auto">Auto language</option>
    <option value="English">English</option>
    <option value="Hindi">Hindi</option>
    <option value="Urdu">Urdu</option>
    <option value="Hinglish">Hinglish</option>
  </select>

  <button onclick="saveSettings()">SAVE SETTINGS</button>
</div>

</section>
</main>

<script>
let token = localStorage.getItem("aura_token") || "";
let lastReply = "";

const $ = id => document.getElementById(id);

async function api(path, options={}) {
  options.headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(token) {
    options.headers.Authorization = "Bearer " + token;
  }

  const r = await fetch(path, options);
  const data = await r.json().catch(()=>({}));

  if(!r.ok) {
    throw new Error(data.error || data.message || "Request failed");
  }

  return data;
}

async function register(){
  try{
    const data = await api("/register", {
      method:"POST",
      body:JSON.stringify({
        username:$("username").value.trim(),
        password:$("password").value
      })
    });

    $("authMsg").textContent = data.message;
  }catch(e){
    $("authMsg").textContent = e.message;
  }
}

async function login(){
  try{
    const data = await api("/login", {
      method:"POST",
      body:JSON.stringify({
        username:$("username").value.trim(),
        password:$("password").value
      })
    });

    token = data.token;
    localStorage.setItem("aura_token", token);

    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");

    $("who").textContent = data.username;
    $("status").textContent = "ONLINE";

    await loadStatus();
    await loadHistory();
    await loadSettings();
  }catch(e){
    $("authMsg").textContent = e.message;
  }
}

async function logout(){
  try{
    await api("/logout", {method:"POST"});
  }catch(e){}

  token="";
  localStorage.removeItem("aura_token");

  $("app").classList.add("hidden");
  $("auth").classList.remove("hidden");
  $("status").textContent="OFFLINE";
}

function addMessage(role,text){
  const div=document.createElement("div");
  div.className="msg " + (role==="user"?"user":"ai");
  div.textContent=text;
  $("chat").appendChild(div);
  $("chat").scrollTop=$("chat").scrollHeight;
}

async function send(){
  const message=$("message").value.trim();
  if(!message) return;

  addMessage("user",message);
  $("message").value="";

  try{
    const data=await api("/chat",{
      method:"POST",
      body:JSON.stringify({message})
    });

    lastReply=data.reply;
    addMessage("assistant",data.reply);
    $("brain").textContent="Brain: "+data.brain;
  }catch(e){
    addMessage("assistant","AURA error: "+e.message);
  }
}

async function loadHistory(){
  try{
    const data=await api("/history");
    $("chat").innerHTML="";

    for(const item of data.history || []){
      addMessage(
        item.role==="user"?"user":"assistant",
        item.content
      );
    }
  }catch(e){}
}

async function loadStatus(){
  try{
    const data=await api("/api/status");
    $("brain").textContent="Brain: "+data.brain;
  }catch(e){}
}

async function loadSettings(){
  try{
    const data=await api("/settings");
    const p=data.profile || {};

    $("profileName").value=p.name || "";
    $("personality").value=p.personality || "helpful";
    $("language").value=p.language || "auto";
  }catch(e){}
}

async function saveSettings(){
  try{
    await api("/settings",{
      method:"POST",
      body:JSON.stringify({
        profile:{
          name:$("profileName").value,
          personality:$("personality").value,
          language:$("language").value
        }
      })
    });

    $("memoryOut").textContent="Settings saved.";
  }catch(e){
    $("memoryOut").textContent=e.message;
  }
}

async function saveMemory(){
  try{
    await api("/memory",{
      method:"POST",
      body:JSON.stringify({
        text:$("memoryText").value
      })
    });

    $("memoryText").value="";
    $("memoryOut").textContent="Memory saved.";
  }catch(e){
    $("memoryOut").textContent=e.message;
  }
}

async function toolTime(){
  try{
    const d=await api("/tool",{
      method:"POST",
      body:JSON.stringify({tool:"time"})
    });

    $("toolOut").textContent =
      JSON.stringify(d.result);
  }catch(e){
    $("toolOut").textContent=e.message;
  }
}

async function toolSystem(){
  try{
    const d=await api("/tool",{
      method:"POST",
      body:JSON.stringify({tool:"system"})
    });

    $("toolOut").textContent =
      JSON.stringify(d.result);
  }catch(e){
    $("toolOut").textContent=e.message;
  }
}

async function toolCalc(){
  try{
    const d=await api("/tool",{
      method:"POST",
      body:JSON.stringify({
        tool:"calculator",
        expression:$("calc").value
      })
    });

    $("toolOut").textContent=String(d.result);
  }catch(e){
    $("toolOut").textContent=e.message;
  }
}

function voiceInput(){
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Voice recognition is not supported by this browser.");
    return;
  }

  const r=new SpeechRecognition();
  r.lang="en-IN";
  r.interimResults=false;
  r.continuous=false;

  r.onresult=e=>{
    $("message").value=e.results[0][0].transcript;
  };

  r.start();
}

function speakLast(){
  if(!lastReply) return;

  if(!("speechSynthesis" in window)){
    alert("Speech synthesis is not supported.");
    return;
  }

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(lastReply);
  u.rate=.95;
  speechSynthesis.speak(u);
}

$("message").addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
}

if(token){
  api("/api/status")
    .then(()=>{
      $("auth").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("status").textContent="ONLINE";
      loadStatus();
      loadHistory();
      loadSettings();
    })
    .catch(()=>{
      token="";
      localStorage.removeItem("aura_token");
    });
}
</script>

</body>
</html>
